# APT Proxy Configuration Example
# Copy this file to one of the following locations:
#   - ./apt-proxy.yaml (current directory)
#   - /etc/apt-proxy/apt-proxy.yaml (system-wide)
#   - ~/.config/apt-proxy/apt-proxy.yaml (user config)
#   - ~/.apt-proxy.yaml (user config)
#
# Or specify a custom path with: apt-proxy --config=/path/to/config.yaml
# Environment variable: APT_PROXY_CONFIG_FILE=/path/to/config.yaml
#
# Configuration priority: CLI flags > Environment variables > Config file > Defaults
#
# This file shows common user-facing YAML fields. Download/resource limits,
# download CIDR lists and upstream_access are YAML-only and require a restart.
# Optional mirror_health and shared_cache policies are documented in docs/.
# See README "Configuration Options" for the available flags and ENV equivalents.

# Server configuration
server:
  # Network interface to bind to
  host: 0.0.0.0
  
  # Port to listen on
  port: 3142
  
  # Enable verbose debug logging
  debug: false

# Cache configuration
cache:
  # Directory to store cached packages
  dir: /var/cache/apt-proxy
  
  # Maximum cache size in GiB. Omitted/nonpositive YAML values use default 10.
  # To disable, use --cache-max-size=0 or APT_PROXY_CACHE_MAX_SIZE=0.
  # When exceeded, least-recently-used files are evicted automatically to keep total size within the limit.
  max_size_gb: 20
  
  # Cache TTL in hours. Omitted/nonpositive YAML values use the default.
  # To disable, use --cache-ttl=0 or APT_PROXY_CACHE_TTL=0.
  # Default: 168 (7 days)
  ttl_hours: 168
  
  # Cache cleanup interval in minutes. Nonpositive YAML uses the default.
  # To disable, use --cache-cleanup-interval=0 or APT_PROXY_CACHE_CLEANUP_INTERVAL=0.
  # Default: 60 (1 hour)
  cleanup_interval_min: 60

  # Default private SHA256 records; complete-body verification precedes a hit.
  # "none" opts out in ordinary mode; shared_cache always requires SHA256.
  integrity: sha256

# Shared payload-copy and active-download admission (YAML-only).
# MiB units. Zero selects these bounded defaults; this is not a total RSS limit.
# See docs/resource-limits.md for refusals, disk headroom and per-instance scope.
resources:
  max_object_mb: 1024
  total_temp_mb: 4096
  max_active_downloads: 32
  min_free_mb: 128

# Upstream fetch time and unknown-length response spooling (YAML-only).
# Units are MiB and seconds. Zero selects the defaults, rather than disabling
# these limits. This legacy spool sub-limit excludes persistent cache and S3
# buffers; the resources budget above counts spool and cache/S3 payload copies.
# Unknown-length bodies are completely spooled before delivery to the client.
download:
  max_spool_mb: 1024
  total_spool_mb: 4096
  timeout_seconds: 1200

# Storage backend (optional)
# By default the cache lives on the local filesystem (above). Switch to "s3"
# to keep every cached body/header in any S3-compatible object store
# (MinIO / Ceph / R2 / B2 / OSS / COS / AWS S3, ...). When backend is "s3"
# cache.dir is not the persistent cache directory. Local temporary space is
# still needed for large uploads and unknown-length downloads. Give independent
# instances separate S3 prefixes; Unix disk coordination is a separate feature.
#
# A complete working example (compose stack with OtterIO, an Apache-2.0
# S3-compatible fork of MinIO) lives in examples/s3-otterio/.
storage:
  backend: disk           # "disk" (default) or "s3"
  s3:
    endpoint: ""          # host[:port], e.g. "s3.amazonaws.com" or "minio:9000"
    region: ""            # required for AWS S3, ignored by most MinIO services
    bucket: ""            # bucket must already exist
    prefix: apt-proxy/    # object key prefix
    access_key: ""        # prefer ENV: APT_PROXY_S3_ACCESS_KEY
    secret_key: ""        # prefer ENV: APT_PROXY_S3_SECRET_KEY
    session_token: ""     # optional STS session token; prefer ENV: APT_PROXY_S3_SESSION_TOKEN
    use_ssl: true         # use HTTPS to talk to the endpoint
    use_path_style: false # MinIO/Ceph need true; AWS/R2/B2 use false
    inline_max_mb: 32     # writes <= 32 MiB stay in RAM, larger spill to temp_dir
                          # Per-write threshold; payload memory and disk copies share resources.total_temp_mb.
                          # Lower this (e.g. 4-8) as needed, while reserving separate process memory headroom.
    temp_dir: ""          # empty = os.TempDir()

# Optional: path to distributions/mirrors YAML (distributions.yaml)
# Enables adding or editing distributions and mirrors without recompiling.
# Hot-reload with SIGHUP or POST /api/mirrors/refresh
# distributions_config: ./config/distributions.yaml

# Third-party origins apt-proxy may fetch and cache unrewritten: a PPA, a
# vendor repository, an internal archive. Empty (the default) means apt-proxy
# serves only the distributions it is configured for and 404s everything else.
#
# Only applies to clients using apt-proxy as their HTTP proxy (http_proxy=...),
# because that is what names the origin in the request. An entry without a port
# matches ports 80 and 443 only; https:// forces the upstream request to TLS.
# Wildcards, loopback/private addresses and localhost are rejected at startup.
#
# passthrough:
#   - ppa.launchpad.net
#   - https://download.docker.com
#   - archive.internal.example:8080

# Mirror configuration
# Use full URLs or shortcuts (e.g., cn:tsinghua, cn:ustc, cn:aliyun)
mirrors:
  # Ubuntu mirror
  ubuntu: cn:tsinghua
  
  # Ubuntu Ports mirror (for ARM, etc.)
  ubuntu_ports: ""
  
  # Debian mirror
  debian: cn:ustc

  # Optional dedicated Debian Security mirror (derived from Debian when empty)
  debian_security: ""
  
  # CentOS mirror
  centos: ""
  
  # Alpine mirror
  alpine: ""

# TLS/HTTPS configuration
tls:
  # Enable TLS
  enabled: false
  
  # Path to TLS certificate file
  cert_file: /etc/ssl/certs/apt-proxy.crt
  
  # Path to TLS private key file
  key_file: /etc/ssl/private/apt-proxy.key

# Security configuration
security:
  # Package downloads: match the immediate TCP peer, before cache lookup.
  # Empty allow list permits every peer except those denied. Deny takes priority.
  # Forwarded headers never grant access; restrict end clients at a reverse proxy.
  # These lists are YAML-only and do not restrict management/operational endpoints.
  download_allow_cidrs: []
  download_deny_cidrs: []

  # API key for protected management endpoints
  # Supports environment variable expansion: ${APT_PROXY_API_KEY}
  api_key: ${APT_PROXY_API_KEY}

  # Enable API authentication (automatically enabled when api_key is set)
  enable_api_auth: true

  # API requests per IP per minute (0 disables; default 60)
  api_rate_limit_per_minute: 60

  # Trusted proxy CIDRs whose X-Forwarded-For is honored by the API rate
  # limiter and IP-based audit fields. Leave empty to ignore XFF entirely
  # (the secure default for direct-exposed deployments).
  # trusted_proxies:
  #   - 10.0.0.0/8
  #   - 192.168.0.0/16

# Optional repository connection policy (YAML-only; disabled for compatibility).
# Applies to downloads, mirror probes and Ubuntu geo discovery, not S3/telemetry.
# Enabling it bypasses HTTP_PROXY/HTTPS_PROXY/NO_PROXY and connects directly to
# approved public IPs. Private repositories need narrow allow_cidrs exceptions.
# Restriction lists must be empty while disabled; restart to apply changes.
upstream_access:
  enabled: false
  allowed_hosts: []      # exact host names/IPs; empty retains repository routing
  allowed_ports: []      # empty means 80/443 when enabled
  allow_cidrs: []        # trusted private/special unicast exceptions

# Optional runtime failover for explicitly equivalent public APT archive roots.
# Requires a successfully observed InRelease/Release fingerprint before switching.
# Restart to change this section; successful mirror refresh resets learned health.
# See docs/runtime-mirror-health.md for privacy, snapshot and resource boundaries.
mirror_health:
  enabled: false
  failure_threshold: 2
  cooldown_seconds: 30
  probe_timeout_seconds: 5       # one total deadline for each candidate selection
  max_manifest_bytes: 2097152
  snapshot_max_age_seconds: 3600
  repositories: []
  # repositories:
  #   - id: ubuntu
  #     mirrors:
  #       - https://primary.example/ubuntu/
  #       - https://secondary.example/archive/
  #     public_query_keys: []    # credential-like names are forbidden

# Upstream transport
# HTTP keep-alive to upstream mirrors. Disable only if a proxy / firewall
# in front mishandles persistent connections.
upstream_keep_alive: true

# Distribution mode
# Optional CentOS Metalink discovery. Client repository definitions must point
# their metalink URL at public_url/metalink while preserving repo/arch/protocol.
# See docs/centos-metalink.md. Only explicitly named returned mirror hosts are used.
# metalink:
#   public_url: http://apt-cache.example:3142
#   source_url: https://mirrors.centos.org/metalink
#   allowed_mirror_hosts: [mirrors.tuna.tsinghua.edu.cn, mirrors.ustc.edu.cn]
#   refresh_seconds: 600
#   timeout_seconds: 15

# Options: all, ubuntu, ubuntu-ports, debian, centos, alpine
mode: all
