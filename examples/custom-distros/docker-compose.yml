name: apt-cache-custom-distros

services:
  apt-proxy:
    image: soulteary/apt-proxy
    restart: always
    environment:
      - TZ=Asia/Shanghai
      # Name the mounted file explicitly instead of relying on search order.
      # /etc/apt-proxy/distributions.yaml is also a current search location.
      - APT_PROXY_DISTRIBUTIONS_CONFIG=/etc/apt-proxy/distributions.yaml
    ports:
      - "3142:3142"
    volumes:
      # An absolute path rather than ./config/: the image's WORKDIR is the
      # cache directory, so the relative search path would put a read-only
      # config file inside that volume.
      - ./distributions.yaml:/etc/apt-proxy/distributions.yaml:ro
