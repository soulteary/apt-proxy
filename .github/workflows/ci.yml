name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.3"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "::error::gofmt diff:" && echo "$fmt_out"
            exit 1
          fi

      - name: Validate client test planning and evidence (without Docker)
        run: |
          python3 tests/client-compatibility/client_matrix_test.py
          for family in apt dnf apk pacman zypper; do
            python3 "tests/$family-client/matrix_test.py"
          done

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Tests with coverage (race + short)
        if: "!(github.event_name == 'pull_request' && runner.os == 'Linux')"
        run: |
          go test -race -short -count=1 -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -n 1

      # Gate here rather than only at release time: a coverage regression that
      # is first reported on a tag push has already been merged.
      - name: Remove stale generated report evidence
        id: report_cleanup
        if: "!cancelled() && (github.event_name == 'pull_request' && runner.os == 'Linux')"
        shell: bash
        run: |
          set -euo pipefail
          test ! -L .github
          rm -f -- .github/go-test-report.md .github/go-test-report.json .github/coverage.svg .github/goreportcard.svg .github/goreportcard-report.md
          rm -rf -- .github/test-results
      - name: Test, race and coverage (GTR v1.1.2)
        id: go_test_report
        uses: soulteary/go-test-report-action@2760569379a1c95a195c602872ba00cd61495d89  # v1.1.3
        with:
          directory: "."
          packages: "./..."
          race: "true"
          coverage_threshold: "80"
          test_args: "-short -count=1"
          version: "v1.1.2"
          cover_mode: "atomic"
          commit: "false"
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
      - name: Go quality report (v1.1.3)
        if: "!cancelled() && (github.event_name == 'pull_request' && runner.os == 'Linux') && steps.report_cleanup.outcome == 'success'"
        id: go_report_card
        uses: soulteary/goreportcard-action@d4669a9fbea514f5995d749177630ebfee755789  # v1.1.4
        with:
          directory: "."
          version: "v1.1.3"
          threshold: "0"
          report: "true"
          commit: "false"
      - name: Restore project Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Reuse GTR coverage profile
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        shell: bash
        env:
          PROFILE: ${{ steps.go_test_report.outputs.coverage_profile }}
        run: |-
          cp "$PROFILE" coverage.out
      - name: Check coverage threshold
        if: matrix.os == 'ubuntu-latest'
        run: scripts/check-coverage.sh coverage.out

      # Rerun the cross-Server isolation cases with -count=3 to catch
      # flakes that the single-pass unit run might miss. Kept on the
      # default (untagged) test build so it stays cheap; the matching
      # integration cases run in the dedicated job below.
      - name: Cross-Server isolation (race x3)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=3 -run 'Isolation|TwoServers' ./internal/...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

      - name: Upload read-only PR quality evidence
        if: "always() && steps.report_cleanup.outcome == 'success' && ((github.event_name == 'pull_request' && runner.os == 'Linux'))"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr-go-quality-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/go-test-report.md
            .github/go-test-report.json
            .github/coverage.svg
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
    permissions:
      contents: read
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build (cross-compile sanity)
        run: |
          GOOS=linux   GOARCH=amd64              go build -trimpath -o /tmp/apt-proxy-linux-amd64   ./cmd/apt-proxy
          GOOS=linux   GOARCH=arm64              go build -trimpath -o /tmp/apt-proxy-linux-arm64   ./cmd/apt-proxy
          GOOS=linux   GOARCH=386                go build -trimpath -o /tmp/apt-proxy-linux-386     ./cmd/apt-proxy
          GOOS=linux   GOARCH=arm   GOARM=6      go build -trimpath -o /tmp/apt-proxy-linux-armv6   ./cmd/apt-proxy
          GOOS=linux   GOARCH=arm   GOARM=7      go build -trimpath -o /tmp/apt-proxy-linux-armv7   ./cmd/apt-proxy
          GOOS=darwin  GOARCH=amd64              go build -trimpath -o /tmp/apt-proxy-darwin-amd64  ./cmd/apt-proxy
          GOOS=darwin  GOARCH=arm64              go build -trimpath -o /tmp/apt-proxy-darwin-arm64  ./cmd/apt-proxy

  container:
    name: Container
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build container image
        run: docker build --file docker/Dockerfile --tag apt-proxy:test .

  integration:
    name: Integration (e2e)
    runs-on: ubuntu-latest
    needs: [test]
    env:
      # Shared test-only credentials; OtterIO rejects its default password.
      OTTERIO_ROOT_USER: apt-proxy-ci
      OTTERIO_ROOT_PASSWORD: apt-proxy-ci-test-password
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Start OtterIO
        # OtterIO is an Apache-2.0 fork of MinIO that speaks the same S3 API.
        # We launch it via `docker run` (rather than a service container) because
        # GitHub Actions services can't pass extra args, and OtterIO's default
        # CMD is just `otterio` (which prints help) — we need `server /data`.
        # The integration tests only need the S3 port (9000); we skip publishing
        # the optional console listener entirely.
        run: |
          docker run -d --name otterio \
            -p 9000:9000 \
            -e OTTERIO_ROOT_USER \
            -e OTTERIO_ROOT_PASSWORD \
            soulteary/otterio:latest \
            server /data

      - name: Wait for OtterIO
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/otterio/health/live >/dev/null; then
              echo "OtterIO is ready"
              exit 0
            fi
            echo "Waiting for OtterIO... ($i)"
            sleep 2
          done
          echo "::error::OtterIO did not become ready in time"
          docker logs otterio || true
          exit 1

      - name: Run integration tests
        env:
          # Point the S3 integration tests at the OtterIO container started above.
          # When unset, those tests skip themselves; here we want them to run.
          # The integration tests create the bucket themselves (MakeBucket) so
          # we don't need an init step.
          APT_PROXY_TEST_S3_ENDPOINT: 127.0.0.1:9000
          APT_PROXY_TEST_S3_ACCESS_KEY: ${{ env.OTTERIO_ROOT_USER }}
          APT_PROXY_TEST_S3_SECRET_KEY: ${{ env.OTTERIO_ROOT_PASSWORD }}
          APT_PROXY_TEST_S3_BUCKET: apt-proxy-itest
          APT_PROXY_TEST_S3_USE_SSL: "false"
          APT_PROXY_TEST_S3_USE_PATH_STYLE: "true"
        run: go test -tags=integration -race -count=1 -timeout=10m ./tests/integration/...

      - name: Dump OtterIO logs on failure
        if: failure()
        run: docker logs otterio || true
