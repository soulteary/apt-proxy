name: Go quality reports
on:
  push:
    tags:
      - '*'
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: go-quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release_gate:
    name: Select tag or skipped-release report run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.trigger.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Avoid repeating ordinary tag reports
        id: trigger
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          enabled=true
          if [ "$EVENT_NAME" = release ]; then
            message=$(git log -1 --format=%B)
            if ! printf '%s\n' "$message" | grep -Eiq '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]|skip-checks:[[:space:]]*true'; then
              enabled=false
              echo "Normal release commit: reports are handled by the tag push." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
  reports:
    needs: release_gate
    if: needs.release_gate.outputs.enabled == 'true'
    name: Release and manual Go reports
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record tested source
        id: source
        shell: bash
        run: |-
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test, race and coverage (GTR v1.1.2)
        id: go_test_report
        uses: soulteary/go-test-report-action@bf04b539f7bf2a6f67d602da4259904b3dcdeba1  # v1.1.2
        with:
          directory: "."
          packages: "./..."
          race: "true"
          coverage_threshold: "80"
          test_args: "-short -count=1"
          version: "v1.1.2"
          cover_mode: "atomic"
          commit: "false"
      - name: Go quality report (v1.1.3)
        id: go_report_card
        uses: soulteary/goreportcard-action@fc43049a5fe61c3313294d217c2a783f375a7970  # v1.1.3
        with:
          directory: "."
          version: "v1.1.3"
          threshold: "0"
          report: "true"
          commit: "false"
      - name: Upload stable reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: go-quality-stable-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/go-test-report.md
            .github/go-test-report.json
            .github/coverage.svg
            .github/goreportcard.svg
            .github/goreportcard-report.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload raw test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: go-quality-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  writeback:
    name: Publish reports once (unchanged default branch only)
    needs:
      - reports
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.event_name == 'release' || startsWith(github.ref,
      'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: go-report-writeback-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.reports.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: go-quality-stable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-quality-stable/.github
      - name: Commit only verified stable reports
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.reports.outputs.source_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPORT_DIR: ${{ runner.temp }}/go-quality-stable
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"
          current=$(git rev-parse FETCH_HEAD)
          if [ "$current" != "$SOURCE_SHA" ]; then
            echo "Default branch differs from the tested source; reports remain available as artifacts." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git switch -C "$DEFAULT_BRANCH" "$current"
          test ! -L .github
          test -f "$REPORT_DIR/.github/go-test-report.md" && test ! -L "$REPORT_DIR/.github/go-test-report.md"
          mkdir -p "$(dirname ".github/go-test-report.md")"
          test ! -L ".github/go-test-report.md"
          cp "$REPORT_DIR/.github/go-test-report.md" ".github/go-test-report.md"
          test -f "$REPORT_DIR/.github/go-test-report.json" && test ! -L "$REPORT_DIR/.github/go-test-report.json"
          mkdir -p "$(dirname ".github/go-test-report.json")"
          test ! -L ".github/go-test-report.json"
          cp "$REPORT_DIR/.github/go-test-report.json" ".github/go-test-report.json"
          test -f "$REPORT_DIR/.github/coverage.svg" && test ! -L "$REPORT_DIR/.github/coverage.svg"
          mkdir -p "$(dirname ".github/coverage.svg")"
          test ! -L ".github/coverage.svg"
          cp "$REPORT_DIR/.github/coverage.svg" ".github/coverage.svg"
          test -f "$REPORT_DIR/.github/goreportcard.svg" && test ! -L "$REPORT_DIR/.github/goreportcard.svg"
          mkdir -p "$(dirname ".github/goreportcard.svg")"
          test ! -L ".github/goreportcard.svg"
          cp "$REPORT_DIR/.github/goreportcard.svg" ".github/goreportcard.svg"
          test -f "$REPORT_DIR/.github/goreportcard-report.md" && test ! -L "$REPORT_DIR/.github/goreportcard-report.md"
          mkdir -p "$(dirname ".github/goreportcard-report.md")"
          test ! -L ".github/goreportcard-report.md"
          cp "$REPORT_DIR/.github/goreportcard-report.md" ".github/goreportcard-report.md"
          git add -- .github/go-test-report.md .github/go-test-report.json .github/coverage.svg .github/goreportcard.svg .github/goreportcard-report.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Go quality reports [skip ci]"
          # A concurrent branch update rejects this ordinary push; never force-push reports.
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
