name: Real DNF clients
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dnf:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [quay.io/centos/centos:stream9, quay.io/centos/centos:stream10]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Check matrix image identifiers and evidence isolation
        run: python3 tests/dnf-client/matrix_test.py
      - name: Exercise DNF with a local signed Metalink repository
        env:
          DNF_CLIENT_IMAGE: ${{ matrix.client }}
        run: bash tests/dnf-client/matrix.sh "$DNF_CLIENT_IMAGE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dnf-client-${{ strategy.job-index }}
          path: dnf-client-evidence/
          retention-days: 14
