# apt-proxy distributions configuration
# Add or edit distributions and mirrors here. Reload with SIGHUP or POST /api/mirrors/refresh.
# If mirrors.official/custom are empty for a distribution, built-in mirrors are used for that dist.
#
# distributions:
#   - id: ubuntu
#     name: Ubuntu
#     type: 1
#     url_pattern: "/ubuntu/(.+)$"
#     benchmark_url: "dists/noble/main/binary-amd64/Release"
#     geo_mirror_api: "http://mirrors.ubuntu.com/mirrors.txt"
#     cache_rules:
#       - pattern: "deb$"
#         cache_control: "max-age=100000"
#         rewrite: true
#       - pattern: "InRelease$"
#         cache_control: "max-age=3600"
#         rewrite: true
#     mirrors:
#       official:
#         - "mirrors.tuna.tsinghua.edu.cn/ubuntu/"
#         - "mirrors.ustc.edu.cn/ubuntu/"
#       custom:
#         - "mirrors.163.com/ubuntu/"
#     aliases:
#       tsinghua: "mirrors.tuna.tsinghua.edu.cn/ubuntu/"
#       ustc: "mirrors.ustc.edu.cn/ubuntu/"
#       aliyun: "mirrors.aliyun.com/ubuntu/"
#       tencent: "mirrors.cloud.tencent.com/ubuntu/"
#       163: "mirrors.163.com/ubuntu/"
#       huaweicloud: "mirrors.huaweicloud.com/repository/ubuntu/"
#
# A type outside 1..5 registers a distribution apt-proxy does not ship. It gets
# its own mirror list, benchmark and rewriter, same as a built-in one:
#
#   - id: deepin
#     name: Deepin
#     type: 6
#     url_pattern: "/deepin/(.+)$"
#     benchmark_url: "dists/apricot/main/binary-amd64/Release"
#     cache_rules:
#       - pattern: "deb$"
#         cache_control: "max-age=100000"
#         rewrite: true
#       - pattern: "(InRelease|Release(\\.gpg)?)$"
#         cache_control: "max-age=3600"
#         rewrite: true
#       # Catch-all last: apt also fetches package indexes
#       # (Packages.xz, by-hash/...), and an unmatched path is a 404.
#       - pattern: ".*"
#         cache_control: "max-age=3600"
#         rewrite: true
#     mirrors:
#       official:
#         - "community-packages.deepin.com/deepin/"
#
# When the archive sits at a domain root there is no path prefix to match, so
# name it by Host instead (apt writes `deb http://apt.armbian.com <suite> main`):
#
#   - id: armbian
#     name: Armbian
#     type: 7
#     url_pattern: "/armbian/(.+)$"
#     host_pattern: "^apt\\.armbian\\.com(:\\d+)?$"
#     benchmark_url: "dists/bookworm/main/binary-arm64/Release"
#     cache_rules:
#       - pattern: "deb$"
#         cache_control: "max-age=100000"
#         rewrite: true
#       - pattern: "(InRelease|Release(\\.gpg)?)$"
#         cache_control: "max-age=3600"
#         rewrite: true
#       - pattern: ".*"
#         cache_control: "max-age=3600"
#         rewrite: true
#     mirrors:
#       official:
#         - "mirrors.tuna.tsinghua.edu.cn/armbian/"

# Optional Proxmox public repositories (disabled examples).
# Requires apt-proxy v0.19.3 or later for host/path routing and URL joining.
# To enable, remove one leading "# " from the desired entry and append it to
# the active distributions list below; do not add another distributions key.
# Keep custom types unique and stable; PBS Client uses the same type as
# examples/proxmox/distributions.yaml, so do not enable both copies.
# These examples use Debian Trixie. Match benchmark_url to your release and
# select the appropriate suite/component in the client's APT sources:
# PVE: pve-no-subscription; PBS: pbs-no-subscription; PBS Client: main;
# Ceph Squid: no-subscription (choose the Ceph release supported by your PVE).
# Enterprise repositories require a subscription and are not covered here.
# host_pattern selects a repository, not client access permissions. Unique
# /proxmox-*/ aliases also work in direct proxy URLs using the proxy hostname.
# References:
# https://pve.proxmox.com/wiki/Package_Repositories
# https://pbs.proxmox.com/docs/installation.html#debian-package-repositories
#
#   - id: proxmox-pve
#     name: Proxmox VE
#     type: 12
#     url_pattern: "^/(debian/pve|proxmox-pve)/(.+)$"
#     host_pattern: '^download\.proxmox\.com(:\d+)?$'
#     benchmark_url: "dists/trixie/Release"
#     cache_rules:
#       - pattern: '\.deb$'
#         cache_control: "max-age=100000"
#         rewrite: true
#       - pattern: '(InRelease|Release(\.gpg)?)$'
#         cache_control: "max-age=3600"
#         rewrite: true
#       # Catch-all last: include package indexes and by-hash metadata.
#       - pattern: ".*"
#         cache_control: "max-age=3600"
#         rewrite: true
#     mirrors:
#       official:
#         - "http://download.proxmox.com/debian/pve/"
#
#   - id: proxmox-pbs
#     name: Proxmox Backup Server
#     type: 13
#     url_pattern: "^/(debian/pbs|proxmox-pbs)/(.+)$"
#     host_pattern: '^download\.proxmox\.com(:\d+)?$'
#     benchmark_url: "dists/trixie/Release"
#     cache_rules:
#       - pattern: '\.deb$'
#         cache_control: "max-age=100000"
#         rewrite: true
#       - pattern: '(InRelease|Release(\.gpg)?)$'
#         cache_control: "max-age=3600"
#         rewrite: true
#       # Catch-all last: include package indexes and by-hash metadata.
#       - pattern: ".*"
#         cache_control: "max-age=3600"
#         rewrite: true
#     mirrors:
#       official:
#         - "http://download.proxmox.com/debian/pbs/"
#
#   - id: proxmox-pbs-client
#     name: Proxmox Backup Client
#     type: 11
#     url_pattern: "^/(debian/pbs-client|proxmox-pbs-client)/(.+)$"
#     host_pattern: '^download\.proxmox\.com(:\d+)?$'
#     benchmark_url: "dists/trixie/Release"
#     cache_rules:
#       - pattern: '\.deb$'
#         cache_control: "max-age=100000"
#         rewrite: true
#       - pattern: '(InRelease|Release(\.gpg)?)$'
#         cache_control: "max-age=3600"
#         rewrite: true
#       # Catch-all last: include package indexes and by-hash metadata.
#       - pattern: ".*"
#         cache_control: "max-age=3600"
#         rewrite: true
#     mirrors:
#       official:
#         - "http://download.proxmox.com/debian/pbs-client/"
#
#   - id: proxmox-ceph-squid
#     name: Proxmox Ceph Squid
#     type: 14
#     url_pattern: "^/(debian/ceph-squid|proxmox-ceph-squid)/(.+)$"
#     host_pattern: '^download\.proxmox\.com(:\d+)?$'
#     benchmark_url: "dists/trixie/Release"
#     cache_rules:
#       - pattern: '\.deb$'
#         cache_control: "max-age=100000"
#         rewrite: true
#       - pattern: '(InRelease|Release(\.gpg)?)$'
#         cache_control: "max-age=3600"
#         rewrite: true
#       # Catch-all last: include package indexes and by-hash metadata.
#       - pattern: ".*"
#         cache_control: "max-age=3600"
#         rewrite: true
#     mirrors:
#       official:
#         - "http://download.proxmox.com/debian/ceph-squid/"
